<!DOCTYPE html>
<html>
<head>
    <title>Add Employee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Add Employee</h1>

<form id="employeeForm">

    <input type="text"
           id="name"
           placeholder="Employee Name"
           required>

    <input type="text"
           id="designation"
           placeholder="Designation"
           required>

    <input type="number"
           id="salary"
           placeholder="Salary"
           required>

    <button type="submit">
        Save Employee
    </button>

</form>

<br>

<a href="index.html">
    <button>Back</button>
</a>

</div>

<script src="app.js"></script>

</body>
</html>
