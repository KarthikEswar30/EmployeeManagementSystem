<!DOCTYPE html>
<html>
<head>
    <title>View Employees</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Employee Details</h1>

    <input
        type="text"
        id="search"
        placeholder="Search by Name or Department">

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Designation</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Salary</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody id="employeeTable">

        </tbody>

    </table>

    <br>

    <a href="index.html">
        <button>Back</button>
    </a>

</div>

<script src="app.js"></script>

</body>
</html>
